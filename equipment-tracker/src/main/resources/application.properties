spring.application.name=equipment-tracker

# Konekcija na bazu

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate konfiguracija

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Local dev: an SMTP catcher such as Mailpit (SMTP on 1025, web UI on 8025)

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}

# Real SMTP server (e.g. port 587 with STARTTLS):
# spring.mail.host=smtp.example.com
# spring.mail.port=587
# spring.mail.username=${MAIL_USERNAME}
# spring.mail.password=${MAIL_PASSWORD}
# spring.mail.properties.mail.smtp.auth=true
# spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=no-reply@equipment-tracker.local

jwt.secret=${JWT_SECRET}